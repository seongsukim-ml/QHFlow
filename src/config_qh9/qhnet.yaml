hydra:
  run:
    dir: outputs/${dataset.dataset_full_name}/${wandb.run_name}


defaults:
  - model: QHNet
  - dataset: QH9Stable
device: 0
ckpt_dir: 'checkpoints'
split_seed: 42
check_val_every_n_epoch: 1

optimizer: adamW
decay_factor: 0.5
decay_patience: 5
# ema_start_epoch: 40  # 40 for water, and 0 for others
ema_start_epoch: -1
warmup_step: 1000
num_training_steps: ${dataset.total_steps}
end_lr: 1e-7
scheduler_power: 3.5

use_init_hamiltonian_residue: False

qh9: True
seed: 0

data_type: float32

loss_weights: {"hamiltonian": 1.0,}

prefix: ""
mode: train


wandb:
  mode: disabled
  project: "DFT-25-QH9"
  entity: "kaist-korea"
  run_id: Null
  run_name: ${model.version}${prefix}-${dataset.dataset_full_name}-UR_${use_init_hamiltonian_residue}
  tags: ["qh9"]
  # resume: must

# resume / inference (inference should be copied or it will be overwritten when training)
ckpt: ''